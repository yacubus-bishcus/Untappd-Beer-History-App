[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "untappd-beer-history"
version = "0.2.1"
description = "Native desktop app for exporting and analyzing Untappd beer history."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Jacob Bickus" }
]

[tool.briefcase]
project_name = "Untappd Beer History"
bundle = "com.yacubusbishcus"
version = "0.2.1"
url = "https://github.com/yacubus-bishcus/untapped_data"
author = "Jacob Bickus"

[tool.briefcase.app.untappd_beer_history]
formal_name = "Untappd Beer History"
description = "Export and analyze Untappd beer history in a native desktop app."
long_description = "A native desktop app for exporting Untappd beer history with Selenium and generating local statistics, including a consumed-location heatmap."
sources = [
  "src/untappd_beer_history",
  "src/app_runtime.py",
  "src/app_config.py",
  "src/paths.py",
  "src/run.py",
  "src/untapped_selenium.py",
]
requires = [
  "urllib3<2",
  "pandas",
  "plotly",
  "requests",
  "beautifulsoup4",
  "selenium",
  "webdriver-manager",
  "toga",
]

[tool.briefcase.app.untappd_beer_history.macOS]
requires = [
  "toga-cocoa",
]
icon = "resources/appicon"
min_os_version = "11.0"
